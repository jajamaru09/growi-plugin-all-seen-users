name: Claude Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude-response:
    # @claude が含まれるときだけ実行（コスト節約のために重要）
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' &&
        contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # ← 必須。忘れると git repository エラー

      - uses: markwylde/claude-code-gitea-action@v1.0.20
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          gitea_token: ${{ secrets.MYGITEA_TOKEN }}
          claude_git_name: Claude
          claude_git_email: claude@anthropic.com
        env:
          GITEA_SERVER_URL: "http://192.168.10.113:8082"